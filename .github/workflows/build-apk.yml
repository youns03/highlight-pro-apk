name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'رابط التطبيق المنشور، مثل https://example.onrender.com'
        required: true
        type: string
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
        run: gradle assembleDebug --no-daemon -PappUrl="${APP_URL}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: highlight-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
