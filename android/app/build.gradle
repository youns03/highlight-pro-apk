plugins {
    id "com.android.application"
}

android {
    namespace "com.youns03.highlightpro"
    compileSdk 35

    defaultConfig {
        applicationId "com.youns03.highlightpro"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    // The Android module is self-contained; the legacy frontend is not part of this APK.
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
