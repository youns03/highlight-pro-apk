plugins {
    id "com.android.application"
}

android {
    namespace "com.youns03.highlightpro"
    compileSdk 35

    defaultConfig {
        applicationId "com.youns03.highlightpro"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    // The Android build bundles the complete web application locally.
    // No Render URL is required to launch or browse the bundled lessons.
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.10.1"
    implementation "androidx.webkit:webkit:1.12.1"
}
